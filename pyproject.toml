[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-fabric-defect-inspection"
version = "0.1.0"
description = "Leakage-safe defect detection and segmentation for woven fabric."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Ali Jamali" }]
dependencies = [
  "imagehash==4.3.2",
  "matplotlib==3.10.6",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pandas==2.3.2",
  "Pillow==11.3.0",
  "py7zr==1.0.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.7.2",
  "scipy==1.16.1",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
