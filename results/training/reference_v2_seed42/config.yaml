seed: 42
data:
  patch_manifest: data/processed/enhanced_patches_256.csv
  image_size: 256
  source_size: 256
  positive_sampling_fraction: 0.5
  augmentation_profile: standard
model:
  encoder: resnet18
  pretrained: true
training:
  epochs: 30
  batch_size: 24
  num_workers: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  bce_weight: 0.5
  dice_weight: 0.5
  positive_pixel_weight: 25.0
  metric_threshold: 0.5
  mixed_precision: true
  progress_bar: false
  early_stopping_patience: 7
output_dir: results/training/reference_v2_seed42
checkpoint_dir: checkpoints/reference_v2_seed42
